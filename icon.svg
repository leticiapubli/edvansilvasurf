  <path d="M64 360 C 140 280, 220 280, 290 350 C 350 410, 420 400, 448 370 C 448 420, 420 448, 64 448 Z" fill="#80D4E2" opacity="0.4" />
  <path d="M64 390 C 160 320, 250 320, 320 380 C 370 420, 410 420, 448 400 C 448 448, 410 448, 64 448 Z" fill="#C4F2FA" opacity="0.6" />
  <!-- Surfboard silhouette -->
