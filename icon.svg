      <stop offset="0%" stop-color="#006874" />
      <stop offset="100%" stop-color="#00363D" />
    </linearGradient>
    <linearGradient id="surfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06D53" />
      <stop offset="100%" stop-color="#FFDAD4" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#oceanGrad)" />
